<!doctype html>

<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Frank Ruhl Libre"; font-weight: 700; src: url("../node_modules/@fontsource/frank-ruhl-libre/files/frank-ruhl-libre-hebrew-700-normal.woff2"); }
  @font-face { font-family: "Rubik"; font-weight: 400; src: url("../node_modules/@fontsource/rubik/files/rubik-hebrew-400-normal.woff2"); unicode-range: U+0590-05FF, U+FB1D-FB4F; }
  @font-face { font-family: "Rubik"; font-weight: 400; src: url("../node_modules/@fontsource/rubik/files/rubik-latin-400-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Rubik"; font-weight: 500; src: url("../node_modules/@fontsource/rubik/files/rubik-hebrew-500-normal.woff2"); unicode-range: U+0590-05FF, U+FB1D-FB4F; }
  @font-face { font-family: "Rubik"; font-weight: 500; src: url("../node_modules/@fontsource/rubik/files/rubik-latin-500-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0614; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #f6efff; font-family: "Rubik", sans-serif; }
  /* liquid light, like the app's background */
  .flow { position: absolute; inset: -160px; filter: blur(56px) saturate(1.4) brightness(1.12); }
  .flow i { position: absolute; border-radius: 50%; display: block; }
  .flow .a { width: 720px; height: 620px; left: -40px; top: 40px; background: radial-gradient(circle, rgba(255, 92, 204, 0.95), rgba(255, 92, 204, 0) 68%); }
  .flow .b { width: 760px; height: 700px; left: 300px; top: -140px; background: radial-gradient(circle, rgba(133, 77, 250, 0.95), rgba(133, 77, 250, 0) 68%); }
  .flow .c { width: 700px; height: 640px; left: 760px; top: 260px; background: radial-gradient(circle, rgba(26, 209, 235, 0.9), rgba(26, 209, 235, 0) 66%); }
  .flow .d { width: 520px; height: 480px; left: 120px; top: 520px; background: radial-gradient(circle, rgba(252, 199, 82, 0.85), rgba(252, 199, 82, 0) 66%); }
  .flow .e { width: 600px; height: 560px; left: 1000px; top: -120px; background: radial-gradient(circle, rgba(41, 92, 242, 0.9), rgba(41, 92, 242, 0) 66%); }
  .ripples { position: absolute; inset: 0; background: repeating-radial-gradient(circle at 26% 62%, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 38px); mix-blend-mode: screen; }
  .veil { position: absolute; inset: 0; background: radial-gradient(ellipse 52% 70% at 68% 52%, rgba(11, 6, 20, 0.8), rgba(11, 6, 20, 0.38) 64%, rgba(11, 6, 20, 0)); }
  .logo { position: absolute; left: 70px; top: 135px; width: 360px; height: 360px; filter: drop-shadow(0 0 30px rgba(255, 94, 207, 0.55)) drop-shadow(0 0 60px rgba(34, 211, 238, 0.35)); }
  .text { position: absolute; right: 80px; top: 92px; width: 720px; text-align: right; }
  .he { font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: 188px; line-height: 1; margin: 0;
        background: linear-gradient(100deg, #ff5ecf, #8b5cf6 35%, #22d3ee 70%, #fde047); -webkit-background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 24px rgba(139, 92, 246, 0.45)); }
  .en { font-weight: 500; font-size: 44px; letter-spacing: 0.06em; margin: 6px 0 26px; color: #fff; opacity: 0.92; }
  .tag { font-size: 40px; font-weight: 500; line-height: 1.35; margin: 0 0 14px; }
  .tag-en { font-size: 25px; white-space: nowrap; line-height: 1.4; margin: 0; color: #d9ccf5; direction: ltr; text-align: right; }
</style>
</head>
<body>
  <div class="card">
    <div class="flow"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i></div>
    <div class="ripples"></div>
    <div class="veil"></div>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff5ecf" /><stop offset=".35" stop-color="#8b5cf6" /><stop offset=".7" stop-color="#22d3ee" /><stop offset="1" stop-color="#fde047" />
        </linearGradient>
      </defs>
      <g fill="none" stroke="url(#lg)" stroke-width="3.4" stroke-linecap="round">
        <path d="M6 52 Q32 0 58 52" />
        <path d="M16 52 Q32 17 48 52" opacity=".85" />
        <path d="M26 52 Q32 34 38 52" opacity=".7" />
      </g>
      <circle cx="32" cy="11" r="3.2" fill="#fde047" />
    </svg>
    <div class="text">
      <h1 class="he">אוהל</h1>
      <p class="en">OHEL</p>
      <p class="tag">לקרוא את התנ״ך, לראות על המפה<br />ולדבר על זה ביחד</p>
      <p class="tag-en">Read the Bible, see it on the map, talk it through together</p>
    </div>
  </div>
</body>
</html>
